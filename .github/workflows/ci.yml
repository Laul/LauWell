name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests (domain, charts)
        run: ./gradlew :core:domain:test :core:charts:test

      - name: Build and lint the app
        run: ./gradlew :app:assembleDebug :app:lintDebug
